name: CI-CD (Test, Build, Push to GAR)

on:
  pull_request:
    branches: ["main"]

  push:
    branches: ["main"]
    tags:
      - "v*.*.*"

env:
  PYTHON_VERSION: "3.11"
  REGION: "us-central1"
  PROJECT_ID: "ml-deployment-486403"
  REPOSITORY: "ml-repo"
  IMAGE_NAME: "flower-service"

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Install dependencies from our project folder.
      # Using working-directory reduces long path errors.
      - name: Install dependencies (app + tests)
        working-directory: module3-milestone2
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest httpx

      - name: Run unit tests
        working-directory: module3-milestone2
        run: pytest -q

  build:
    name: Build Docker image (validation)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: module3-milestone2
          file: module3-milestone2/Dockerfile
          push: false
          tags: local/${{ env.IMAGE_NAME }}:ci

  publish:
    name: Authenticate + Push to GAR (tags only)
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Extract semantic version tag
        id: version
        run: echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build and push image to GAR
        run: |
          IMAGE_URI=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.TAG }}
          echo "Pushing: $IMAGE_URI"

          docker build -t "$IMAGE_URI" module3-milestone2
          docker push "$IMAGE_URI"
