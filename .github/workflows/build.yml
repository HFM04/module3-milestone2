# Milestone 2 CI/CD pipeline for a Dockerized FastAPI ML service.
#
# Pipeline stages (rubric):
#   1) Test         -> run pytest to validate /health and /predict behavior
#   2) Build        -> build Docker image to ensure Dockerfile works
#   3) Authenticate -> obtain Google Cloud credentials securely from GitHub Secrets
#   4) Push         -> upload image to Google Artifact Registry with semantic version tag
#
# IMPORTANT DESIGN RULES:
# - We run tests on PRs and pushes to main (quality gate).
# - We push images ONLY on semantic version tags: vX.Y.Z
#   This prevents accidental publishing on every commit.
#
# Our GAR target:
#   us-central1-docker.pkg.dev/ml-deployment-486403/ml-repo/flower-service:<tag>

name: CI-CD (Test, Build, Push to GAR)

on:
  pull_request:
    branches: ["main"]

  push:
    branches: ["main"]
    # Only push images when we create a semantic version tag like v1.0.0
    tags:
      - "v*.*.*"

env:
  PYTHON_VERSION: "3.11"
  REGION: "us-central1"
  PROJECT_ID: "ml-deployment-486403"
  REPOSITORY: "ml-repo"
  IMAGE_NAME: "flower-service"

jobs:
  # ============================================================
  # 1) TEST STAGE
  # ============================================================
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets up a Python runtime on the GitHub runner so we can run pytest.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Install app dependencies + test dependencies.
      # - requirements.txt contains runtime deps (FastAPI, sklearn, joblib, etc.)
      # - pytest + httpx are needed to run unit tests for FastAPI endpoints.
      - name: Install dependencies (app + tests)
        run: |
          python -m pip install --upgrade pip
          pip install -r module3/milestone2/app/requirements.txt
          pip install pytest httpx

      # Run tests from module3/milestone2 so "from app.app import app" resolves correctly.
      - name: Run unit tests
        working-directory: module3/milestone2
        run: pytest -q

  # ============================================================
  # 2) BUILD STAGE (always, after tests)
  # ============================================================
  # We always build the Docker image to validate the Dockerfile and build context.
  build:
    name: Build Docker image (validation)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Builds the image using our Dockerfile at module3/milestone2/Dockerfile.
      # push=false because we only push when a semantic tag is created.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: module3/milestone2
          file: module3/milestone2/Dockerfile
          push: false
          tags: local/${{ env.IMAGE_NAME }}:ci

  # ============================================================
  # 3) AUTH + 4) PUSH STAGES (tags only)
  # ============================================================
  publish:
    name: Authenticate + Push to GAR (tags only)
    runs-on: ubuntu-latest
    needs: build

    # Only run this job when the workflow is triggered by a tag.
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using a Service Account JSON key stored as a GitHub Secret.
      #
      # Security note:
      # - The JSON key is never committed to the repo.
      # - It lives only in GitHub Secrets and is injected at runtime.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Install gcloud so we can configure Docker authentication for Artifact Registry.
      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Configure Docker to authenticate to GAR in the specified region.
      # This writes auth config so `docker push` can talk to Artifact Registry.
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Extract tag name (e.g., v1.0.0) from the Git reference.
      # GitHub provides GITHUB_REF_NAME = the tag string without "refs/tags/".
      - name: Extract semantic version tag
        id: version
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # Build and push to GAR with the semantic version tag.
      - name: Build and push image to GAR
        run: |
          IMAGE_URI=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.TAG }}
          echo "Pushing: $IMAGE_URI"

          docker build -t "$IMAGE_URI" module3/milestone2
          docker push "$IMAGE_URI"

